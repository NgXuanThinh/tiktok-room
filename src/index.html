<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok LIVE 3D Interactive Bar</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/": "/node_modules/three/"
      }
    }
  </script>
</head>
<body>
  <!-- 3D WebGL Canvas Mount -->
  <div id="canvas-container"></div>

  <!-- HUD Stream Overlay (OBS Optimized) -->
  <div id="hud-overlay">
    <div class="top-hud">
      <!-- Top 5 Donors Leaderboard -->
      <div class="glass-panel leaderboard-card">
        <div class="leaderboard-title">
          <span>★</span> TOP DONORS
        </div>
        <div id="leaderboard-list" class="leaderboard-list">
          <div class="leader-item">
            <div class="rank-badge rank-1">#1</div>
            <img class="leader-avatar" src="/api/avatar?name=Top1" alt="Top1" />
            <span class="leader-name">Waiting for Donors...</span>
            <span class="leader-coins">★ 0</span>
          </div>
        </div>
      </div>

      <!-- Hype Meter & Frenzy Mode Gauge -->
      <div class="glass-panel hype-container">
        <div class="hype-header">
          <span>HYPE METER</span>
          <span id="hype-text">0%</span>
        </div>
        <div class="hype-bar-bg">
          <div id="hype-fill" class="hype-bar-fill"></div>
        </div>
      </div>
    </div>

    <!-- Center Gift Alert Pop-in Banner -->
    <div id="gift-banner" class="glass-panel gift-banner tier-small">
      <img id="banner-avatar" class="banner-avatar" src="/api/avatar?name=Gifter" alt="Gifter" />
      <div class="banner-body">
        <div id="banner-title" class="banner-text-title">User đã tặng Quà!</div>
        <div class="banner-sub-row">
          <span id="banner-logo" class="banner-logo">🎁</span>
          <span id="banner-sub" class="banner-coins-badge">100🪙</span>
        </div>
      </div>
    </div>

    <!-- 1-Click Audio Unlock Prompt Banner -->
    <div id="audio-unlock-banner" class="glass-panel audio-unlock-pill hud-interactive">
      🎵 Click anywhere to enable Club Music & Sound
    </div>

    <!-- Interactive Stream Like Button (Thả tim) -->
    <div id="like-button-container" class="hud-interactive">
      <button id="btn-stream-like" class="stream-like-btn" title="Thả tim (phím L hoặc Space)">
        <span class="like-btn-icon">❤️</span>
        <span class="like-btn-text">LIKE</span>
        <span id="like-btn-counter" class="like-btn-counter">0</span>
      </button>
    </div>

    <!-- CINEMATIC 2D OVERLAY (HIGH-TIER DONATE SHOWCASE) -->
    <div id="cinematic-overlay">
      <div class="cinematic-backdrop" id="cinematic-backdrop"></div>
      <canvas id="cinematic-fx-canvas"></canvas>

      <div class="cinematic-stage" id="cinematic-stage">
        <div class="cinematic-avatar-wrapper" id="cinematic-avatar-wrap">
          <div class="cinematic-wings" id="cinematic-wings">
            <div class="wing wing-left"></div>
            <div class="wing wing-right"></div>
          </div>
          <div class="cinematic-crown" id="cinematic-crown">👑</div>
          <div class="avatar-ornament" id="avatar-ornament"></div>
          <div class="avatar-ring-glow" id="avatar-ring-glow"></div>
          <div class="avatar-frame" id="avatar-frame">
            <img id="cinematic-avatar-img" class="avatar-img" src="" alt="Donor Avatar" />
          </div>
          <canvas id="cinematic-chibi-canvas" width="90" height="90"></canvas>
        </div>

        <div class="cinematic-info" id="cinematic-info">
          <div class="cinematic-donor-title" id="cinematic-donor-title">✨ VIP DONOR ✨</div>
          <div class="cinematic-donor-name" id="cinematic-donor-name">@ThinhPro</div>
          <div class="cinematic-gift-badge" id="cinematic-gift-badge">
            <span id="cinematic-gift-emoji">🎁</span>
            <span id="cinematic-gift-name">Quà Cao Cấp</span>
            <span id="cinematic-gift-coins">500🪙</span>
          </div>
        </div>
      </div>

      <!-- FOREGROUND 3D SLIME CANVAS (Z-INDEX 10: NHẢY PHÍA TRƯỚC TOÀN BỘ) -->
      <canvas id="cinematic-slime-canvas"></canvas>
      <div class="cinematic-skip-hint" id="cinematic-skip-btn">✕ Bấm để bỏ qua</div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
